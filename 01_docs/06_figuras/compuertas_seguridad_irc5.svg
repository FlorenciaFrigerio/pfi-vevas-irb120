    <text x="14" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#e2e8f0">RobotWare 6.12 · Mesa</text>
    <text x="14" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#e2e8f0">medida (190 mm, 4 cajas)</text>
    <text x="14" y="88" font-family="Consolas, monospace" font-size="11" fill="#fda4af">z_min = 80 mm activo</text>
  </g>

  <!-- Gate 2 -->
  <g transform="translate(240, 68)">
    <rect width="202" height="110" rx="10" fill="#1e293b" stroke="#475569"/>
