  <g transform="translate(458, 68)">
    <rect width="202" height="110" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="14" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#eab308">03 · GO DIARIO DE SESIÓN</text>
    <text x="14" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#e2e8f0">11 ítems confirmados +</text>
    <text x="14" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#e2e8f0">paro a mano + frase exacta</text>
    <text x="14" y="88" font-family="Consolas, monospace" font-size="11" fill="#fde047">"MOVER ROBOT REAL"</text>
  </g>

  <!-- Gate 4 -->
  <g transform="translate(676, 68)">
    <rect width="202" height="110" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="14" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">04 · REVISIÓN 240 NUDOS</text>
