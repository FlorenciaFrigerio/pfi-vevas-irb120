  <text x="28" y="51" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#94a3b8">Ninguna orden viaja al controlador IRC5 si falla cualquiera de las cinco verificaciones en serie.</text>

  <!-- Gate 1 -->
  <g transform="translate(22, 68)">
