    <text x="14" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#e2e8f0">J1–J6 por RWS iguales al</text>
    <text x="14" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#e2e8f0">FlexPendant DSQC 679</text>
    <text x="14" y="88" font-family="Consolas, monospace" font-size="11" fill="#fdba74">FK Δ = 0,0001 mm</text>
  </g>

