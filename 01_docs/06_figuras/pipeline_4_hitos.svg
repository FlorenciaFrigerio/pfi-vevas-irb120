<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 214" width="100%">
  <rect width="1120" height="214" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="34" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#1f2a33">ARQUITECTURA FUNCIONAL DEL PROYECTO · CADENA DE VERIFICACIÓN ENTRE HITOS</text>
  <text x="32" y="53" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#5a6672">La salida validada de cada etapa alimenta sin cambios la etapa siguiente: una sola tabla Denavit-Hartenberg gobierna todo el repositorio.</text>

  <!-- Step 1 -->
  <g transform="translate(26, 72)">
    <rect width="246" height="118" rx="12" fill="#fdf2f8" stroke="#9d174d" stroke-width="1.5"/>
    <rect x="14" y="14" width="66" height="22" rx="11" fill="#9d174d"/>
    <text x="47" y="29" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">HITO 1</text>
    <text x="90" y="29" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2a33">Gemelo Digital</text>
    <text x="14" y="55" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#334155">• Tabla D-H Truc &amp; Lam (2020)</text>
    <text x="14" y="74" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#334155">• Factorización exacta a URDF</text>
    <text x="14" y="93" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#9d174d">Salida: T₀⁶(q) validada vs ROS TF</text>
  </g>

  <!-- Arrow 1->2 -->
  <path d="M 278 131 L 298 131" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(304, 72)">
    <rect width="246" height="118" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="14" y="14" width="66" height="22" rx="11" fill="#ea580c"/>
    <text x="47" y="29" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">HITO 2</text>
    <text x="90" y="29" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2a33">Cinemática y LSPB</text>
    <text x="14" y="55" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#334155">• 8 ramas analíticas de Pieper</text>
    <text x="14" y="74" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#334155">• Jacobiano SVD + LSPB 6 ejes</text>
    <text x="14" y="93" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c2410c">Salida: q*(t) suave + modelo τ 1R</text>
  </g>

  <!-- Arrow 2->3 -->
  <path d="M 556 131 L 576 131" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(582, 72)">
    <rect width="246" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="14" y="14" width="72" height="22" rx="11" fill="#2563eb"/>
    <text x="50" y="29" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">HITO 3/4 A</text>
    <text x="94" y="29" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2a33">VEVAS Studio</text>
    <text x="14" y="55" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#334155">• Figuras 2D/3D (plano YZ frontal)</text>
    <text x="14" y="74" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#334155">• Colisiones + σ_min + GO sesión</text>
    <text x="14" y="93" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d4ed8">Salida: Plan C² verificado (65 pts)</text>
  </g>

  <!-- Arrow 3->4 -->
  <path d="M 834 131 L 854 131" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(860, 72)">
    <rect width="234" height="118" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
    <rect x="14" y="14" width="72" height="22" rx="11" fill="#15803d"/>
    <text x="50" y="29" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">HITO 3/4 B</text>
    <text x="94" y="29" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2a33">ABB IRC5 Real</text>
    <text x="14" y="55" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#334155">• RWS + MoveAbsJ \T:=t (z1/fine)</text>
    <text x="14" y="74" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" fill="#334155">• Tope físico C02 = 5 % ficha ABB</text>
    <text x="14" y="93" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">Salida: muestras.csv + evidencia</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
