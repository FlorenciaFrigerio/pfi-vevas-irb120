# Manifiesto del modelo (protocolo W12-S01). Si un campo es null, el resultado que dependa de él
# es exploratorio y no cuenta como conformidad FK/IK/J.
robot_model: ABB_IRB120-3/0.6
robot_serial: 120-101516
controller_model: IRC5 Compact
robotware_version: 6.12.01.00
controller_options_verified: ["689-1 Externally Guided Motion", "616-1 PC Interface", "UDPUC driver", "StateMachine Add-In 1.1"]
controller_options_source: "fotos del FlexPendant (Información del sistema), noviembre 2026"
ros_distribution: jazzy
operating_system: Ubuntu 24.04 LTS (disco externo)
driver: PickNikRobotics/abb_ros2 (rama rolling) + paquete abb_irb120_support propio
workspace: /home/huesero/abb_ws
kinematics_reference:
  own_model: "hito3_4/vevas/robot_irb120.py (D-H estándar, convención Truc & Lam)"
  independent_reference: "cadena del URDF de ROS-Industrial irb120_3_58 (orígenes y ejes por junta)"
  agreement_s0: "6e-16 m en 5000 posturas (hito3_4/docs/datos/validacion_offline/casos_fk.csv)"
  agreement_s1: null   # completar con hito3_4/docs/datos/validacion_rws.csv
model_commit: null     # completar: git rev-parse --short HEAD
model_sha256_12: null  # lo imprime herramientas/validacion_offline.py
dh_parameters:   # a [m], alpha [rad], d [m], theta_offset [rad]
  - [0.000, -1.5707963, 0.290, 0.0]
  - [0.270,  0.0,       0.000, -1.5707963]
  - [0.070, -1.5707963, 0.000, 0.0]
  - [0.000,  1.5707963, 0.302, 0.0]
  - [0.000, -1.5707963, 0.000, 0.0]
  - [0.000,  0.0,       0.072, 0.0]
base_frame: "base del robot ABB (Base del controlador, wobj0 sin desplazar)"
flange_frame: "marco 6 D-H; tool0 = T_0^6 · Rz(180°)"
tool_frame: tool0
tcp_frame: "tool0 (sin herramienta); si se monta una, poner tcp_xyz_m y tcp_rpy_rad en hito3_4/config.json"
joint_order: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
joint_sign: [1, 1, 1, 1, 1, 1]
joint_offset_deg: [0, 0, 0, 0, 0, 0]
joint_convention_status: "S0 verificado contra URDF ROS-I; S1 pendiente (verificar_convencion_rws.py)"
joint_limits_deg: [[-165, 165], [-110, 110], [-110, 70], [-160, 160], [-120, 120], [-400, 400]]
joint_max_speed_deg_s: [250, 250, 250, 320, 320, 420]
angle_unit: rad
length_unit: m
rpy_convention: "EulerZYX: R = Rz(rz)·Ry(ry)·Rx(rx), como el FlexPendant"
quaternion_order: "[w, x, y, z] (q1..q4 de ABB)"
data_source_state: "/joint_states del joint_state_broadcaster (abb_hardware_interface por EGM) o simulador"
clock: "time.monotonic() de la PC para errores; hora local en eventos.jsonl"
tolerances:
  fk_offline_position_m: 1.0e-6     # propuesta del grupo, pendiente de aprobación docente
  fk_offline_orientation_rad: 1.0e-5
  fk_vs_controller_position_mm: 0.5 # propuesta: el controlador redondea a 0.01 mm
  fk_vs_controller_orientation_deg: 0.05
  tracking_abort_deg: 3.0
record_status: partially_verified
